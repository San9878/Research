<script>
document.addEventListener('DOMContentLoaded',()=>{
  document.querySelectorAll('main table').forEach(t=>{if(t.parentElement.classList.contains('table-responsive'))return;let d=document.createElement('div');d.className='table-responsive';d.setAttribute('role','region');d.setAttribute('tabindex','0');d.setAttribute('aria-label','Tabla desplazable horizontalmente');t.before(d);d.append(t)});
  document.querySelectorAll('a[href^="#"]').forEach(a=>a.addEventListener('click',()=>{let el=document.getElementById(decodeURIComponent(a.hash.slice(1)));for(let p=el?.parentElement;p;p=p.parentElement)if(p.tagName==='DETAILS')p.open=true}));
});
</script>

<!-- C3VD experiment filters -->
<script>
document.addEventListener('DOMContentLoaded',()=>{
  const input=document.getElementById('experiment-search'),select=document.getElementById('experiment-group'),count=document.getElementById('experiment-count');
  if(!input||!select)return;
  const cards=[...document.querySelectorAll('.experiment-card')],groups=[...document.querySelectorAll('details.experiment-group')];
  [...new Set(cards.map(c=>c.dataset.group))].forEach(g=>{let o=document.createElement('option');o.value=g;o.textContent=g;select.append(o)});
  const normalize=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
  const entries=cards.map(c=>({card:c,text:normalize(c.textContent)}));
  function filter(){
    const term=normalize(input.value),group=select.value;let n=0;
    entries.forEach(({card,text})=>{const show=(!term||text.includes(term))&&(!group||card.dataset.group===group);card.hidden=!show;if(show)n++});
    groups.forEach(g=>{g.hidden=![...g.querySelectorAll('.experiment-card')].some(c=>!c.hidden);if((term||group)&&!g.hidden)g.open=true});
    count.textContent=n+' de '+cards.length+' fichas';
  }
  input.addEventListener('input',filter);select.addEventListener('change',filter);filter();
  // Index links clear filters and open the enclosing group and experiment.
  document.querySelectorAll('a[href^="#exp-"]').forEach(a=>a.addEventListener('click',()=>{input.value='';select.value='';filter();const c=document.getElementById(a.hash.slice(1));if(c){c.open=true;for(let p=c.parentElement;p;p=p.parentElement)if(p.tagName==='DETAILS')p.open=true}}));
});
</script>
