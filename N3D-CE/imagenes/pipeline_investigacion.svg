<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="670" viewBox="0 0 1160 670" role="img" aria-labelledby="title desc">
<title id="title">Pipeline de reconstrucción y controles de entrenamiento</title><desc id="desc">La inferencia utiliza imágenes RGB; el GT define objetivos y evaluación separados. Las cabezas de profundidad, puntos y cámara se evalúan por rutas distintas.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="none" stroke="#6b8c79" stroke-width="1.3"/></marker><style>text{font-family:system-ui,sans-serif;fill:#214d37}.head{font-size:22px;font-weight:700}.title{font-size:17px;font-weight:650}.body{font-size:14px}.small{font-size:12px;fill:#567160}.box{fill:#f1f7f2;stroke:#b8cebe;stroke-width:1.5}.gt{fill:#fff9ec;stroke:#dacb9b;stroke-width:1.5}.arrow{stroke:#6b8c79;stroke-width:1.7;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:6 5}</style></defs>
<rect x="1" y="1" width="1158" height="668" rx="15" fill="#fff" stroke="#d9e5dc"/>
<text x="32" y="40" class="head">Inferencia: RGB → geometría</text>
<text x="32" y="65" class="small">El GT no entra como imagen de profundidad ni pose de entrada al modelo.</text>
<rect class="box" x="30" y="95" width="195" height="110" rx="10"/><text x="48" y="122" class="title">Datos y rectificación</text><text x="48" y="148" class="body">RGB, IDs y resolución</text><text x="48" y="172" class="body">Unidades y K coherentes</text><text x="48" y="192" class="small">Control D01 · contrato</text>
<path class="arrow" d="M225,150 H255"/>
<rect class="box" x="265" y="95" width="195" height="110" rx="10"/><text x="283" y="122" class="title">Ventana de N vistas</text><text x="283" y="148" class="body">Selección, orden y ancla</text><text x="283" y="172" class="body">GT solo en vistas medidas</text><text x="283" y="192" class="small">D07 / E02 · sensibilidad</text>
<path class="arrow" d="M460,150 H490"/>
<rect class="box" x="500" y="95" width="260" height="110" rx="10"/><text x="518" y="122" class="title">Encoder y agregador</text><text x="518" y="148" class="body">VGGT: atención global</text><text x="518" y="172" class="body">VGG-T³: estado y pasos TTT</text><text x="518" y="192" class="small">Pesos congelados ≠ TTT desactivado</text>
<path class="arrow" d="M760,150 H790"/>
<rect class="box" x="800" y="88" width="330" height="125" rx="10"/><text x="818" y="115" class="title">Cabezas y salidas separadas</text><text x="818" y="141" class="body">Puntos globales P</text><text x="818" y="164" class="body">Profundidad D + cámara (K, R, t)</text><text x="818" y="190" class="small">E05-B · acuerdo no garantiza exactitud</text>
<path class="arrow" d="M965,213 V252 H850 V285"/>
<rect class="box" x="630" y="295" width="500" height="106" rx="10"/><text x="650" y="324" class="title">Evaluación: dos rutas, soporte común</text><text x="650" y="352" class="body">P vs GT · D+K+pose vs GT · trayectoria si existe GT</text><text x="650" y="378" class="small">Escala / Sim(3) / ICP declarados; no mezclar sus protocolos.</text>
<text x="32" y="270" class="head">Fine-tuning: objetivos y actualización</text>
<rect class="gt" x="30" y="295" width="245" height="106" rx="10"/><text x="48" y="324" class="title">GT y partición</text><text x="48" y="351" class="body">D, K, R, t → puntos GT</text><text x="48" y="377" class="small">SCARED: solo ancla medida</text>
<path class="arrow dash" d="M275,348 H305"/>
<rect class="gt" x="315" y="295" width="275" height="106" rx="10"/><text x="333" y="324" class="title">Elegir K vistas supervisadas</text><text x="333" y="351" class="body">No confundir K targets con N RGB</text><text x="333" y="377" class="small">V9 / VN19 · calendario registrado</text>
<path class="arrow dash" d="M452,401 V438"/>
<rect class="box" x="315" y="448" width="275" height="107" rx="10"/><text x="333" y="478" class="title">Pérdidas y normalización</text><text x="333" y="505" class="body">Predicción frente al GT válido</text><text x="333" y="530" class="small">E07-B · receta específica</text>
<path class="arrow" d="M590,500 H625"/>
<rect class="box" x="635" y="448" width="250" height="107" rx="10"/><text x="653" y="478" class="title">Backward y optimizador</text><text x="653" y="505" class="body">Solo módulos habilitados</text><text x="653" y="530" class="small">LR, clipping, seed y presupuesto</text>
<path class="arrow" d="M885,500 H920"/>
<rect class="box" x="930" y="448" width="200" height="107" rx="10"/><text x="948" y="478" class="title">Validar y guardar</text><text x="948" y="505" class="body">Guardas por secuencia</text><text x="948" y="530" class="small">Pesos y logs trazables</text>
<path class="arrow dash" d="M1025,448 V410"/>
<text x="32" y="604" class="body">V9 / VN19-C3VD: cámara + profundidad + puntos. VN18/V9-SCARED: profundidad + puntos, cámara fija.</text>
<text x="32" y="632" class="small">El diagrama resume las recetas principales; los experimentos que descongelaron otros módulos conservan su configuración propia.</text>
</svg>
